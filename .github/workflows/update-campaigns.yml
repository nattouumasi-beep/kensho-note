name: Collect candidates and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '13 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kensho-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always check out the latest branch, including when an older run is retried.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check classification rules
        run: python -m unittest discover -s tests -v
      - name: Collect public RSS
        id: collect
        continue-on-error: true
        run: python scripts/update_feed.py
      - name: Save candidates
        if: steps.collect.outcome == 'success'
        run: |
          if ! git diff --quiet -- data/campaigns.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/campaigns.json
            git commit -m 'chore: update public RSS candidates [skip ci]'
            if ! git push; then
              echo '::warning::Branch moved during feed save; continuing to publish current collected feed.'
            fi
          fi
      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/campaigns.json _site/data/campaigns.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
